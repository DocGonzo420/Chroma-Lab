# After a community photo's pull request is merged, rebuild the Community list in the app.
name: Build community list
on:
  push:
    branches: [main]
    paths: ["community/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: community-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build_community.py
      - name: Commit the rebuilt list
        run: |
          if git diff --quiet; then echo "Nothing to update"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update the community list"
          git push
