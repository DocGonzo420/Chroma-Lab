name: Community photo
description: Share a photo you took, with its palette, for the Community filter in Chroma Lab.
title: "Community photo: "
labels: ["community photo"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing. Chroma Lab fills most of this in for you when you tap **Share to Community** in the app. Once the photo is approved it shows up under the **Community** filter, with your name on it.

        This post is public while it's reviewed. Photos are resized and their location data is removed before they go into the app.
  - type: input
    id: photo-title
    attributes:
      label: Photo title
      placeholder: Morning fog over the harbor
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Name to credit
      description: Shown with the photo in the app and on any card made from it.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where it was taken (optional)
  - type: input
    id: license
    attributes:
      label: License
      description: "CC BY 4.0: anyone may use it if they credit you. CC0 1.0: anyone may use it, no credit needed."
      value: CC BY 4.0
    validations:
      required: true
  - type: textarea
    id: palette
    attributes:
      label: Palette
      description: The HEX codes from Chroma Lab, separated by commas.
      render: text
  - type: textarea
    id: photo
    attributes:
      label: Photo
      description: Drag the photo Chroma Lab saved for you into this box, or paste it here.
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: I took this photo, or I own the rights to it.
          required: true
        - label: No one in it can be recognized, or everyone shown agreed to share it.
          required: true
        - label: Chroma Lab may show it, and anyone may reuse it under the license above.
          required: true
